services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hexmind
      POSTGRES_PASSWORD: ${HEXMIND_DB_PASSWORD:-hexmind}
      POSTGRES_DB: hexmind
    # Port 5433 avoids clashing with a locally installed PostgreSQL; loopback only.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexmind -d hexmind"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Optional trace viewer (PRD §14.2): `docker compose --profile observability up -d`, then set
  # HEXMIND_OTLP_ENDPOINT=http://127.0.0.1:4318/v1/traces and open http://127.0.0.1:16686.
  # Traces are also kept in Postgres and shown in the app, so this is not required.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

volumes:
  pgdata:
