# Installers for the desktop app: `npm run package` (from the repository root).
# The installer holds the desktop app only; the backend runs from the repository
# (`npm run backend`), see README "Install". Builds are unsigned.
appId: dev.hexmind.desktop
productName: H.E.X Mind
copyright: Copyright © 2026 Shrey Tiwari
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
mac:
  target: dmg
  category: public.app-category.developer-tools
  icon: build/icon.png
  identity: null
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  category: Development
  icon: build/icon.png
electronVersion: 45.0.0
