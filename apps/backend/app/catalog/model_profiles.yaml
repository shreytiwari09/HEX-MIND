# Curated model profiles (PRD §10.3, §10.8).
#
# These are CURATED ESTIMATES, not measurements. Tiers run 1 (weak) to 5 (best) and say how
# a model family compares with the others here, on four capabilities the assigner cares about.
# The evaluation (PRD §15) is meant to replace them with measured results. A model that matches
# no pattern has no profile; the assigner treats it as unknown and never assumes a tier.
#
# Patterns are matched in order against the lower-cased model id (and its last path segment, so
# "anthropic/claude-sonnet-5-5" on OpenRouter matches "claude-sonnet*"). First match wins, so
# specific patterns come before general ones.
#
# edit_format: search_replace | fenced | whole_file (how reliably the model follows each).
# quirks: known behaviours the code already works around.
last_reviewed: "2026-11-19"
evidence: estimate

profiles:
