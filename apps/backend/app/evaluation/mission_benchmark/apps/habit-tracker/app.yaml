id: habit-tracker
idea: 'A habit tracker: add habits, check them off on the days you did them, and see your streaks and how
  often you stick to a habit. It is a plain CommonJS library (no server): the functions are described
  in the plan.'
plan:
  title: Habit tracker
  milestones:
  - id: m1-habits
    title: Habits and check-ins
    validators: []
    features:
    - id: habits
      title: Habits and check-ins
      persona: backend
      description: src/habits.js exports createHabits(), addHabit(store, name), checkIn(store, id, date),
        getHabit(store, id) and listHabits(store). A habit is {id, name, checkIns} where checkIns is a
        list of ISO dates (YYYY-MM-DD) kept sorted. Ids start at 1 and count up.
      expected_behavior:
      - addHabit trims the name and throws Error('name required') when it is empty
      - addHabit throws Error('habit exists') for a name already used, ignoring case
      - checkIn throws Error('unknown habit') for an unknown id and Error('invalid date') for a string that is
        not a real calendar date in YYYY-MM-DD form
      - checkIn returns true when it adds a date and false when that date was already checked in
      - checkIns stay sorted whatever the order they were added in
      - getHabit returns the habit or null; listHabits returns the habits in id order
      target_files:
      - src/habits.js
      - src/habits.test.js
  - id: m2-streaks
    title: Streaks and rates
    validators: []
    features:
    - id: streaks
      title: Streaks and completion rate
      persona: backend
      description: src/streaks.js exports currentStreak(store, id, today), longestStreak(store, id) and
        completionRate(store, id, today, days), over the habits from src/habits.js (read a habit through
        getHabit). Dates are ISO strings; use UTC date arithmetic.
      expected_behavior:
      - currentStreak counts the consecutive days with a check-in ending today, or ending yesterday when
        today has none yet; it is 0 when neither day has one
      - longestStreak is the longest run of consecutive days with a check-in, 0 for no check-ins
      - completionRate is the number of check-ins in the last `days` days (today included) divided by days,
        rounded to two decimals
      - all three throw Error('unknown habit') for an unknown id
      target_files:
      - src/streaks.js
      - src/streaks.test.js
  validation_contract:
  - id: VC-1
    text: Habit names are trimmed and unique ignoring case
    how: unit test
    feature: habits
  - id: VC-2
    text: Check-ins reject invalid dates and are not counted twice
    how: unit test
    feature: habits
  - id: VC-3
    text: Streaks count consecutive days and allow a streak that ends yesterday
    how: unit test
    feature: streaks
